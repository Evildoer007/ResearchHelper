<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ResearchHelper</title><link rel="icon" href="app-icon.svg"><script src="login/theme-bootstrap.js"></script><link rel="stylesheet" href="ui/designer-token-vars.css"><link rel="stylesheet" href="ui/styles.css"><link rel="stylesheet" href="ui/refinement.css"><link rel="stylesheet" href="ui/theme-overrides.css"><link rel="stylesheet" href="ui/choice-controls.css"><link rel="stylesheet" href="ui/user-guide.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="ui/desk-views.css"><link rel="stylesheet" href="ui/task-search.css"><link rel="stylesheet" href="ui/user-guide-adaptation.css"></head>
<!-- Direct port of OptionHelper optchat/index.html. The four shared CSS files are byte-identical local copies. -->
<body class="workspace-body workspace-body--initializing"><div class="workspace-shell workspace-shell--desk" data-workspace-shell data-mode="chat" data-switching="false" data-has-desk="true" data-report-open="false" data-initializing="true" aria-busy="true" data-rail-collapsed="false">
<aside class="workspace-rail workspace-rail--unbranded tasks rail" id="tasks" aria-label="任务历史"><section class="rail-mode-area" aria-label="工作模式"><div class="mode-switch mode-switch--rail" data-mode-switch><button type="button" data-mode="chat" aria-pressed="true">ResChat</button><button type="button" data-mode="desk" aria-pressed="false">ResDesk</button></div></section><button class="rail-new-task" type="button" data-action="new"><span aria-hidden="true">＋</span><span class="rail-new-task__label">新建任务</span></button><section class="task-rail" aria-label="任务历史"><div class="task-search" hidden><label class="sr-only" for="task-search">搜索任务或报告</label><input id="task-search" type="search" placeholder="搜索任务或报告"></div><div class="task-list" id="task-list"></div></section>
<footer class="rail-footer" data-account-menu-root>
  <button class="rail-account-trigger" type="button" data-account-menu-toggle aria-haspopup="menu" aria-controls="account-menu" aria-expanded="false"><span class="rail-account-trigger__mark" aria-hidden="true"><img src="brand.svg" alt=""></span><strong class="rail-account-trigger__name" data-account-label>离线研究</strong></button>
  <button class="rail-help-trigger" type="button" data-user-guide aria-label="打开使用说明" title="使用说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 0 1 4.6 1c0 1.5-2.3 1.7-2.3 3.3"/><path d="M12 16.5h.01"/></svg></button>
  <div class="rail-account-menu" id="account-menu" role="menu" aria-label="账户与设置" hidden>
    <div class="rail-account-menu__identity"><strong data-account-menu-label>离线研究</strong></div>
    <div class="rail-account-menu__separator" aria-hidden="true"></div>
    <button class="rail-account-menu__item" type="button" data-action="settings" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>设置中心</button>
    <button class="rail-account-menu__item" type="button" data-action="knowledge" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5C9 3.8 6 3.5 3 4.5v15c3-1 6-.7 9 1 3-1.7 6-2 9-1v-15c-3-1-6-.7-9 1Zm0 0v15"/></svg>知识与模板</button>
    <button class="rail-account-menu__item" type="button" data-action="archived-tasks" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v5H4zM6 9v11h12V9M10 13h4"/></svg>归档任务</button>
    <button class="rail-account-menu__item" type="button" data-action="library" role="menuitem" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/></svg>报告库</button>
    <button class="rail-account-menu__item" type="button" data-action="switch-account" data-auth-required role="menuitem" tabindex="-1" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></svg>切换账户</button>
    <button class="rail-account-menu__item rail-account-menu__item--logout" type="button" data-action="logout" data-auth-required role="menuitem" tabindex="-1" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 4H5v16h5M10 12h10m-4-4 4 4-4 4"/></svg>退出登录</button>
  </div>
</footer></aside>
<div class="workspace-splitter workspace-splitter--rail" data-workspace-splitter="rail" role="separator" aria-label="调整任务栏宽度" aria-orientation="vertical" tabindex="0"></div>
<main class="work-area" id="workspace" tabindex="-1"><header class="workbench-head"><div><h1 id="task-title">新建研究任务</h1><p id="task-meta" class="sr-only"></p></div><div class="workbench-head__actions"><button class="button-secondary button-secondary--head task-history-toggle web-control" type="button" data-action="tasks" aria-controls="tasks" aria-expanded="false" aria-label="打开任务历史"><svg class="task-history-icon--desktop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.75" y="4.25" width="16.5" height="15.5" rx="2.5"/><path d="M9.75 4.25v15.5"/></svg><svg class="task-history-icon--mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h8"/></svg></button><button class="button-secondary button-secondary--head report-drawer-toggle web-control" type="button" data-action="artifacts" aria-controls="task-context" aria-expanded="false" aria-label="打开任务与交付"><svg viewBox="0 0 24 24"><rect x="3.75" y="4.25" width="16.5" height="15.5" rx="2.5"/><path d="M14.25 4.25v15.5"/></svg></button></div></header>
<div class="workspace-content"><section class="chat-surface chat-surface--empty" id="chat-surface" aria-label="任务对话"><h2 class="sr-only">研究对话</h2><div class="conversation-scroll-stage" id="chat-scroll-stage"><div class="message-stream" id="chat" aria-live="polite"></div></div></section><section id="artifacts" class="rh-artifacts" aria-label="研究产物" hidden><nav class="views desk-module-tabs" role="tablist" aria-label="研究视图"><span class="desk-module-tabs__indicator" aria-hidden="true"></span><button id="view-0" data-stage="0" role="tab" aria-controls="content" aria-selected="true">研究概览</button><button id="view-1" data-stage="1" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">数据来源</button><button id="view-2" data-stage="2" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">研究底稿</button><button id="view-3" data-stage="3" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">研究报告</button><button id="view-4" data-stage="4" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">跟踪复核</button></nav><div id="content" role="tabpanel" aria-labelledby="view-0" tabindex="0"></div></section></div>
<section class="assistant-region composer-dock" aria-label="任务助手">
  <button class="assistant-toggle" type="button" data-action="assistant-toggle" aria-controls="assistant-panel" aria-expanded="false" aria-label="打开任务对话" hidden></button>
  <section class="assistant-panel" id="assistant-panel" aria-label="任务对话">
    <button class="assistant-panel__resize" type="button" data-assistant-resize aria-label="调整对话窗口大小，方向键微调" title="拖拽调整大小"><span aria-hidden="true"></span></button>
    <header class="assistant-panel__head"><strong data-assistant-title>ResChat</strong><button class="assistant-panel__close" type="button" data-action="assistant-close" aria-label="收起任务对话"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header>
    <div class="assistant-panel__transcript" id="assistant-transcript"></div>
<div class="desk-command-dock__body"><div class="composer composer--shared" data-attachment-drop-target><form id="chat-form"><textarea id="chat-input" name="content" rows="1" placeholder="输入你的问题…" aria-label="任务要求"></textarea><div class="composer-actions"><div class="composer-actions__leading"><button class="composer-attach-control" type="button" data-action="attach" aria-controls="material-file" aria-label="添加研究材料"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="composer-attach-control" type="button" data-action="scope" aria-label="新任务范围与预算"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button></div><div class="composer-actions__trailing"><label class="model-picker"><span class="model-picker__label">当前运行环境</span><select data-choice aria-label="当前运行环境"><option>离线研究</option></select></label><button class="send-control send-button" type="submit" aria-label="发送研究问题"><svg viewBox="0 0 24 24"><path class="send-arrow" d="M12 19V5M6 11l6-6 6 6"/><path class="send-success" d="m7.5 12.5 3 3 6-7"/><rect class="stop-square" x="5" y="5" width="14" height="14" rx="1.5"/></svg></button></div></div></form></div></div>
  </section>
</section></main>
<div class="workspace-splitter workspace-splitter--context" aria-hidden="true"></div><button class="workspace-sheet-scrim" id="context-scrim" data-action="close-context" aria-label="关闭任务与交付" hidden></button><aside class="task-context" id="task-context" aria-label="任务与交付" aria-hidden="true" hidden><header class="task-context__head"><h2>任务与交付</h2><button type="button" class="drawer-close" data-action="close-context" aria-label="收起任务与交付"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header><section class="task-context__group"><div id="context-summary"></div></section><section class="task-context__group" id="context-operations"><h3>研究操作</h3><div class="operation-list" id="task-actions"></div></section></aside><button class="workspace-sheet-scrim task-scrim" data-action="dismiss-tasks" aria-label="关闭任务列表" hidden></button></div>
<div id="notice" role="status" aria-live="polite"></div><dialog id="dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button data-action="close" aria-label="关闭"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header><div id="dialog-content"></div></dialog><input id="backup-file" type="file" accept=".json" hidden><input id="material-file" type="file" accept=".pdf,.txt,.md,.docx,.html,.htm" hidden><script src="demo-data.js"></script><script src="ui/scrollbar-activity.js"></script><script src="ui/choice-controls.js"></script><script src="ui/task-menu.js"></script><script src="ui/task-search.js"></script><script src="ui/user-guide.js"></script><script src="ui/message-actions.js"></script><script src="ui/message-prose.js"></script><script src="ui/workspace-controls.js"></script><script src="source-viewer.js"></script><script src="ui/workspace-settings.js"></script><script src="ui/conversation-scroll.js"></script><script src="ui/conversation-transition.js"></script><script src="ui/conversation-outline.js"></script><script src="ui/composer-controls.js"></script><script src="ui/thinking-orbs-engine.js"></script><script src="ui/thinking-orb.js"></script><script src="ui/research-process.js"></script><script src="ui/desk-assistant.js"></script><script src="ui/research-data.js"></script><script src="ui/desk-interactions.js"></script><script src="ui/desk-overview.js"></script><script src="ui/desk-sources.js"></script><script src="ui/desk-workingpaper.js"></script><script src="ui/desk-report.js"></script><script src="ui/desk-tracking.js"></script><script src="ui/artifact-export.js"></script><script src="workspace.js"></script></body></html>
