<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head><body class="setup-page">

        <a class="connection-item" href="#preferences"><svg class="settings-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg><strong>通用设置</strong></a>
        <a class="connection-item" href="#runtime"><svg class="settings-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H4zM8 21h8M12 17v4M7 10h2M11 10h6M7 13h4"/></svg><strong>运行状态</strong></a>
        <a class="connection-item" href="#model" data-admin-only><svg class="settings-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5C5 4.1 8.1 3 12 3s7 1.1 7 2.5v5c0 1.4-3.1 2.5-7 2.5s-7-1.1-7-2.5zM5 5.5C5 6.9 8.1 8 12 8s7-1.1 7-2.5M5 10.5v5c0 1.4 3.1 2.5 7 2.5M16 16.5v4M14 18.5h4"/></svg><strong>模型配置</strong></a>
        <a class="connection-item" href="#data" data-admin-only><svg class="settings-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.7"/><path d="M5 5.5v6.5c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7V5.5M5 12v6.5c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7V12"/></svg><strong>数据接口</strong></a>

      <section class="connection-editor"><header class="settings-content-header"><button class="settings-close" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>

    </div>
