<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="rh-report-template" content="report-standard@1">
<title>研究报告</title>
<style data-paper-scaffold>
:root{--paper:#fff;--ink:#252525;--red:#c8102e;--rule:#e2e2e2}*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:var(--ink);font:12px/1.4 Arial,"PingFang SC",sans-serif}.reader{display:grid;grid-template-columns:32mm 210mm;gap:8mm;max-width:calc(100% - 32px);width:max-content;margin:24px auto}.report-toc{align-self:start;position:sticky;top:24px}.report-toc a{display:block;padding:6px 0;color:inherit;text-decoration:none}.report-toc a span{margin-right:8px;color:var(--red)}main{width:210mm;padding:14px 26px;background:var(--paper)}.report-header{border-top:2px solid var(--red);border-bottom:1px solid var(--rule);padding:12px 0}.report-header h1{font-size:18px;margin:0}.strategy{padding:6px 0;border-bottom:1px solid var(--rule)}h2{font-size:14.5px;line-height:1.4}.conclusion-band{background:#f4f4f4;padding:7px 10px}.paper-figure-group{display:grid;gap:12px}.paper-figure-group[data-columns="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.paper-figure-group[data-columns="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}.paper-figure-group>*{min-width:0}table{width:100%;border-collapse:collapse}th,td{padding:3px;border-bottom:1px solid var(--rule)}.report-source-line{font-size:11px;color:#6b6b6b;margin-top:8px}[hidden]{display:none!important}@media(max-width:960px){.reader{display:block;width:100%;max-width:100%;margin:0}.report-toc{position:sticky;top:0;background:#fff;z-index:3}.report-toc nav{display:flex;overflow:auto}.report-toc a{padding:10px;white-space:nowrap}main{width:min(210mm,100%);margin:auto}}@media(max-width:700px){main{padding:14px 16px}.paper-figure-group[data-columns]{grid-template-columns:1fr}}@media print{@page{size:A4;margin:7mm}.reader{display:block;margin:0}.report-toc{display:none}main{width:auto;padding:0}}
</style>
</head>
<body class="report-profile-a4 rh-publication" data-report-template="report-standard" data-report-output="report" data-report-variant="standard" data-template-version="1">
<a class="skip-link" href="#summary">跳到正文</a>
<div class="reader">
<aside class="report-toc" aria-label="报告目录"><nav data-paper-slot="contents"></nav></aside>
<main>
<header class="report-header" data-paper-slot="header"><div class="report-head__copy"><h1>研究标题</h1></div></header>
<section id="summary" class="paper-conclusion" data-paper-slot="summary"><h2>核心结论</h2></section>
<div id="theses" class="paper-logics" data-paper-slot="logics"></div>
<div class="paper-supporting" data-paper-slot="supporting"></div>
<section id="risk" data-paper-slot="risk"><h2>风险提示</h2></section>
<footer class="report-source-line" data-paper-slot="source"></footer>
</main>
</div>
</body>
</html>
